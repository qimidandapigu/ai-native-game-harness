<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <title>AI Native Game Harness</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #e9f4ff; background: radial-gradient(circle at 50% 20%, #183b51 0, #0a1b28 42%, #050b12 100%); }
    main { width: min(680px, calc(100vw - 48px)); padding: 44px; border: 1px solid rgba(133, 205, 255, .2); border-radius: 24px; background: rgba(6, 17, 26, .78); box-shadow: 0 30px 90px rgba(0, 0, 0, .4); }
    .eyebrow { color: #66d7ff; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 12px 0 10px; font-size: clamp(30px, 5vw, 48px); line-height: 1.05; }
    #message { margin: 28px 0 8px; font-size: 18px; font-weight: 650; }
    #detail { min-height: 48px; margin: 0; color: #91a9bb; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bar { height: 4px; margin-top: 30px; overflow: hidden; border-radius: 99px; background: #132d3e; }
    .bar::after { content: ""; display: block; width: 35%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2cc7ff, #8f7cff); animation: loading 1.3s ease-in-out infinite alternate; }
    @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(285%); } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Game distribution powered by DSH</div>
    <h1>AI Native<br>Game Harness</h1>
    <p id="message">正在准备本地运行环境</p>
    <p id="detail">第一次启动需要安装内置游戏插件，可能需要一点时间。</p>
    <div class="bar"></div>
  </main>
  <script src="./status.js"></script>
</body>
</html>
