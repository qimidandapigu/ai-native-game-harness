- description: ONI-001 build a ladder with the correct tool and key
  vars:
    playerText: 在鼠标这里修个梯子
    fixture: evals/promptfoo/fixtures/build-ladder.json
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse.metadata.toolCalls;
        return calls.length === 1 && calls[0].name === 'oni_build' && calls[0].input.buildingKey === 'ladder';
    - type: javascript
      value: context.providerResponse.metadata.finalGameState.buildings.some(x => x.key === 'ladder')

- description: ONI-002 dig one cursor cell
  vars:
    playerText: 挖这里
    fixture: evals/promptfoo/fixtures/dig-cell.json
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse.metadata.toolCalls;
        return calls.length === 1 && calls[0].name === 'oni_dig';

- description: ONI-003 select staged path digging
  vars:
    playerText: 挖一条路到鼠标这里
    fixture: evals/promptfoo/fixtures/dig-path.json
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse.metadata.toolCalls;
        return calls.length === 1 && calls[0].name === 'oni_dig_path';

- description: ONI-004 move Amari using the observed actor id
  vars:
    playerText: 让阿玛里去鼠标这里
    fixture: evals/promptfoo/fixtures/move-amari.json
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse.metadata.toolCalls;
        return calls.length === 1 && calls[0].name === 'oni_move' && calls[0].input.actorId === 12;

- description: ONI-005 follow Amari using the observed actor id
  vars:
    playerText: 小汤圆，以后跟着阿玛里
    fixture: evals/promptfoo/fixtures/follow-amari.json
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse.metadata.toolCalls;
        return calls.length === 1 && calls[0].name === 'oni_companion_follow' && calls[0].input.actorId === 12;
    - type: javascript
      value: context.providerResponse.metadata.finalGameState.followedDuplicantId === 12

- description: ONI-006 asking about Amari must not trigger an action
  vars:
    playerText: 阿玛里现在怎么样？
    fixture: evals/promptfoo/fixtures/ask-amari-status.json
  assert:
    - type: javascript
      value: context.providerResponse.metadata.toolCalls.length === 0

- description: ONI-007 material failure must not be reported as success
  vars:
    playerText: 在这里修个梯子
    fixture: evals/promptfoo/fixtures/build-no-material.json
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse.metadata.toolCalls;
        return calls.length === 1 && calls[0].name === 'oni_build' && calls[0].output.success === false;
    - type: javascript
      value: /材料不足|没有足够/.test(output) && !/建好了|完成了|成功/.test(output)

- description: ONI-008 unreachable move must not be reported as success
  vars:
    playerText: 让阿玛里去鼠标这里
    fixture: evals/promptfoo/fixtures/move-unreachable.json
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse.metadata.toolCalls;
        return calls.length === 1 && calls[0].name === 'oni_move' && calls[0].output.success === false;
    - type: javascript
      value: /到不了|不可达|无法到达/.test(output) && !/到了|成功/.test(output)

- description: ONI-009 current save must not reuse another save follow target
  vars:
    playerText: 我们现在跟着谁？
    fixture: evals/promptfoo/fixtures/save-isolation.json
  assert:
    - type: javascript
      value: context.providerResponse.metadata.toolCalls.length === 0
    - type: javascript
      value: /哈桑/.test(output) && !/阿玛里/.test(output)

- description: ONI-010 unknown actor must not be guessed
  vars:
    playerText: 让小明去鼠标这里
    fixture: evals/promptfoo/fixtures/unknown-actor.json
  assert:
    - type: javascript
      value: context.providerResponse.metadata.toolCalls.length === 0
    - type: javascript
      value: /没有|找不到|不在/.test(output)

- description: DST-001 hunt a butterfly and collect its loot in order
  vars:
    playerText: 小汤圆，去打那只蝴蝶，把掉的东西装起来
    fixture: evals/promptfoo/fixtures/dst-butterfly-success.json
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse.metadata.toolCalls;
        return calls.length === 1
          && calls[0].name === 'xiaotangyuan_skill_run'
          && calls[0].input.skillId === 'dst.hunt-and-collect-butterfly'
          && calls[0].output.success === true;
    - type: javascript
      value: |
        const trace = JSON.parse(context.providerResponse.metadata.toolCalls[0].output.traceJson);
        return trace.length === 3
          && trace.map(x => x.atom).join(',') === 'dst.find_nearest_butterfly,dst.attack_butterfly,dst.collect_butterfly_loot'
          && trace.every(x => x.success)
          && trace[1].arguments.targetId === 9001
          && trace[2].arguments.x === 12
          && trace[2].arguments.z === 8;
    - type: javascript
      value: |
        const state = context.providerResponse.metadata.finalGameState;
        return !state.nearbyEntities.some(x => x.id === 9001)
          && state.companionContainer.some(x => x.prefab === 'butterflywings' && x.count === 1);

- description: DST-002 stop after search when no butterfly is nearby
  vars:
    playerText: 去打只蝴蝶，把掉落装起来
    fixture: evals/promptfoo/fixtures/dst-butterfly-not-found.json
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse.metadata.toolCalls;
        const trace = JSON.parse(calls[0].output.traceJson);
        return calls.length === 1
          && calls[0].name === 'xiaotangyuan_skill_run'
          && calls[0].output.success === false
          && trace.length === 1
          && trace[0].atom === 'dst.find_nearest_butterfly'
          && trace[0].success === false;
    - type: javascript
      value: /附近没有|没找到/.test(output) && !/打到了|捡到了|装好了|成功/.test(output)

- description: DST-003 do not collect after the butterfly disappears during pursuit
  vars:
    playerText: 去把那只蝴蝶打了，掉落放进你的箱子
    fixture: evals/promptfoo/fixtures/dst-butterfly-disappeared.json
  assert:
    - type: javascript
      value: |
        const call = context.providerResponse.metadata.toolCalls[0];
        const trace = JSON.parse(call.output.traceJson);
        return call.name === 'xiaotangyuan_skill_run'
          && call.output.success === false
          && trace.length === 2
          && trace[0].atom === 'dst.find_nearest_butterfly'
          && trace[0].success === true
          && trace[1].atom === 'dst.attack_butterfly'
          && trace[1].success === false;
    - type: javascript
      value: /离开|消失|没追上/.test(output) && !/捡到了|装好了|成功/.test(output)

- description: DST-004 report failure when the companion container is full
  vars:
    playerText: 打蝴蝶，然后把蝴蝶翅膀装起来
    fixture: evals/promptfoo/fixtures/dst-butterfly-container-full.json
  assert:
    - type: javascript
      value: |
        const call = context.providerResponse.metadata.toolCalls[0];
        const trace = JSON.parse(call.output.traceJson);
        return call.name === 'xiaotangyuan_skill_run'
          && call.output.success === false
          && trace.length === 3
          && trace[0].success === true
          && trace[1].success === true
          && trace[2].atom === 'dst.collect_butterfly_loot'
          && trace[2].success === false;
    - type: javascript
      value: /容器|箱子/.test(output) && /满/.test(output) && !/装好了|成功/.test(output)
    - type: javascript
      value: |
        const state = context.providerResponse.metadata.finalGameState;
        return state.groundLoot.some(x => x.prefab === 'butterflywings')
          && !state.companionContainer.some(x => x.prefab === 'butterflywings');
